<style>
:root{--bg:#f6f0ff;--card:#fff;--ink:#2a1745;--mut:#6d5a8c;--pri:#5b2a86;--pri2:#8e44c9;--gold:#f2b705;--gold2:#d4a017;--ok:#2a9d5c;--bad:#d62828;--line:#e3d3f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b26;--card:#26143f;--ink:#f6efff;--mut:#bba6dd;--line:#4a2d73;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
header{background:linear-gradient(100deg,#2e1250,var(--pri));color:var(--gold);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--gold)}
header h1{font-size:1.1rem;margin:0;flex:1}#who{color:#fff;font-size:.9rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:2px solid var(--line)}
nav button{white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700}
a.btn{display:inline-block;text-decoration:none;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700}
a.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1745}
button.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1745}
button.on{background:var(--gold);color:#2a1745}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.cover{border-radius:26px;padding:26px 14px;text-align:center;color:#fff;margin-bottom:16px;border:3px solid var(--gold);background:radial-gradient(circle at 20% 20%,rgba(242,183,5,.35) 0 8%,transparent 9%),radial-gradient(circle at 85% 75%,rgba(242,183,5,.3) 0 10%,transparent 11%),repeating-conic-gradient(from 0deg at 50% 120%,#4a1d78 0 10deg,#5b2a86 10deg 20deg)}
.cover h2{margin:6px 0;color:var(--gold);font-size:1.7rem}.cover .row{font-size:2rem;letter-spacing:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border-radius:18px;padding:14px;text-align:center;color:#fff;border:2px solid var(--gold)}
.item .e{font-size:2.6rem}.item small{display:block;opacity:.85;font-weight:400;margin-top:4px}
.g0{background:linear-gradient(135deg,#5b2a86,#8e44c9)}.g1{background:linear-gradient(135deg,#b8860b,#f2b705);color:#2a1745}.g2{background:linear-gradient(135deg,#3b1a5e,#6a3fb5)}.g3{background:linear-gradient(135deg,#8e44c9,#d4a017)}.g4{background:linear-gradient(135deg,#4a1d78,#c9971c)}
input{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin:6px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.menu button{padding:20px 10px;font-size:1.05rem;border:2px solid var(--gold)}
.tags span{display:inline-block;background:var(--gold);color:#2a1745;border-radius:20px;padding:2px 10px;font-size:.8rem;margin:2px}
.mat{display:flex;gap:12px;align-items:flex-start}.mat .e{font-size:2.6rem}.mat p{margin:4px 0}
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#viewer.show{display:flex}
#viewer .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));color:#fff;gap:8px}
#viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
#viewer .none{color:#fff;text-align:center;padding:30px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs button{width:100%;margin-bottom:8px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.pairs button.sel{border-color:var(--gold);background:#fff0c2;color:#222}
.pairs button.done{background:var(--ok);color:#fff}.pairs button.wrong{background:var(--bad);color:#fff}
.flips{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.flips button{aspect-ratio:1;font-size:1.5rem;border-radius:16px}
.flips button.ok{background:var(--ok)}.flips button.no{background:var(--bad)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--bad);color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{font-weight:700;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.q{background:linear-gradient(160deg,#fffaf0,#ffe6b0);color:#2a1745;border-color:var(--gold)}
.q .opt{background:#fff;color:#2a1745;border-color:#e0c27a}
.q .opt.t{color:#1b8a4b;border-color:#1b8a4b}.q .opt.f{color:#c62828;border-color:#c62828}
.q .opt.ok{background:#2a9d5c;color:#fff;border-color:#2a9d5c}.q .opt.no{background:#d62828;color:#fff;border-color:#d62828}
.q h3,.q p{color:#2a1745}
.good{color:#1b8a4b;font-weight:700}.bad{color:#c62828;font-weight:700}
.mwrap{position:relative;display:flex;justify-content:space-between;gap:46px;padding:16px;border-radius:22px;background:linear-gradient(160deg,#fffaf0,#ffe6b0);border:3px solid var(--gold);color:#2a1745;user-select:none}
.mwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.mcol{flex:1;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.mi{position:relative;background:#fff;border:3px solid #d9b45a;border-radius:14px;padding:12px;font-weight:700;color:#2a1745;cursor:pointer;touch-action:none;font-size:.95rem}
.mi.l.sel{border-color:var(--pri);background:#f1e6ff}.mi.done{border-color:#2a9d5c;background:#e3f6ea}.mi.bad{border-color:#d62828;background:#fde4e4}
.mi .dot{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--pri);border:3px solid var(--gold)}
.mi.l .dot{right:-12px}.mi.r .dot{left:-12px}
.mwrap .fb{position:relative;z-index:1}
.tbl{overflow-x:auto}.mut{color:var(--mut)}
</style>
</head>
